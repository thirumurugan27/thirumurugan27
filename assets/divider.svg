<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20">
  <defs>
    <linearGradient id="beam" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="base-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#21262d" stop-opacity="1"/>
      <stop offset="80%" stop-color="#21262d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0"/>
    </linearGradient>
    <filter id="beam-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base dim line -->
  <line x1="50" y1="10" x2="850" y2="10" stroke="url(#base-line)" stroke-width="1" opacity="0.6"/>

  <!-- Animated beam -->
  <line x1="50" y1="10" x2="850" y2="10" stroke="url(#beam)" stroke-width="2" filter="url(#beam-glow)"/>

  <!-- Edge dots -->
  <circle cx="50" cy="10" r="2" fill="#38bdf8" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="10" r="2" fill="#c084fc" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
