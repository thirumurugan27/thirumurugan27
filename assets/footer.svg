<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wave fill (background below wave) -->
  <path d="M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50 L900 200 L0 200 Z" fill="url(#fbg)">
    <animate attributeName="d"
      values="M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50 L900 200 L0 200 Z;
              M0 50 C150 90, 300 10, 450 50 C600 90, 750 10, 900 50 L900 200 L0 200 Z;
              M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50 L900 200 L0 200 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Wave stroke (animated gradient line) -->
  <path d="M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50" fill="none" stroke="url(#wv)" stroke-width="2.5" filter="url(#fglow)">
    <animate attributeName="d"
      values="M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50;
              M0 50 C150 90, 300 10, 450 50 C600 90, 750 10, 900 50;
              M0 50 C150 10, 300 90, 450 50 C600 10, 750 90, 900 50"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Second wave (offset) -->
  <path d="M0 60 C200 30, 400 90, 600 55 C750 30, 850 75, 900 60" fill="none" stroke="url(#wv)" stroke-width="1" opacity="0.3">
    <animate attributeName="d"
      values="M0 60 C200 30, 400 90, 600 55 C750 30, 850 75, 900 60;
              M0 55 C200 80, 400 20, 600 60 C750 80, 850 35, 900 55;
              M0 60 C200 30, 400 90, 600 55 C750 30, 850 75, 900 60"
      dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Floating particles below the wave -->
  <circle cx="100" cy="120" r="1.5" fill="#38bdf8" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-20; 0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="140" r="1" fill="#818cf8" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,-15; 0,0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="110" r="2" fill="#c084fc" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-18; 0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="150" r="1.5" fill="#38bdf8" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 4,-12; 0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="125" r="1" fill="#818cf8" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -6,-16; 0,0" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="130" r="1.5" fill="#c084fc" opacity="0.25">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 3,-22; 0,0" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="160" r="1" fill="#c084fc" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -2,-10; 0,0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="630" cy="170" r="1.5" fill="#38bdf8" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-14; 0,0" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Twinkling star particles -->
  <circle cx="300" cy="100" r="3" fill="url(#star)" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="90" r="2.5" fill="url(#star)" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="95" r="2" fill="url(#star)" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="85" r="2" fill="url(#star)" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer text -->
  <text x="450" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#484f58" letter-spacing="3">
    CRAFTED WITH ♥ AND LOTS OF ☕
  </text>
</svg>
