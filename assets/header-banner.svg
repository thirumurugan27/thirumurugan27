<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bggrad" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="ng1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow-lg" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pill-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.7" fill="#30363d" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background + dot grid -->
  <rect width="900" height="280" fill="url(#bggrad)"/>
  <rect width="900" height="280" fill="url(#dots)"/>

  <!-- Top gradient border -->
  <rect x="0" y="0" width="900" height="2.5" fill="url(#ng1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Bottom gradient border -->
  <rect x="0" y="277.5" width="900" height="2.5" fill="url(#ng1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets TL -->
  <path d="M0 36 L0 0 L36 0" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- Corner brackets TR -->
  <path d="M864 0 L900 0 L900 36" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <!-- Corner brackets BL -->
  <path d="M0 244 L0 280 L36 280" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
  </path>
  <!-- Corner brackets BR -->
  <path d="M864 280 L900 280 L900 244" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.55">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="100" rx="160" ry="80" fill="#38bdf8" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="160;180;160" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="180" rx="140" ry="70" fill="#c084fc" opacity="0.025">
    <animate attributeName="opacity" values="0.015;0.04;0.015" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="140;165;140" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating code symbols (pure SMIL) -->
  <!-- </> top-left -->
  <text x="55" y="52" font-family="'Courier New', monospace" font-size="19" fill="#38bdf8" opacity="0.22">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite"/>
  </text>
  <!-- { } top-right -->
  <text x="808" y="64" font-family="'Courier New', monospace" font-size="21" fill="#818cf8" opacity="0.2">
    { }
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-10;0,0" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="7.5s" repeatCount="indefinite"/>
  </text>
  <!-- λ right -->
  <text x="852" y="148" font-family="'Courier New', monospace" font-size="24" fill="#c084fc" opacity="0.18">
    λ
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-8;0,0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- () bottom-left -->
  <text x="40" y="248" font-family="'Courier New', monospace" font-size="17" fill="#c084fc" opacity="0.18">
    ( )
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,10;0,0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite"/>
  </text>
  <!-- => bottom-right -->
  <text x="800" y="252" font-family="'Courier New', monospace" font-size="16" fill="#38bdf8" opacity="0.18">
    =&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0;3,-10;0,0" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.28;0.1" dur="6.5s" repeatCount="indefinite"/>
  </text>
  <!-- // top-center -->
  <text x="730" y="42" font-family="'Courier New', monospace" font-size="13" fill="#818cf8" opacity="0.15">
    // async
    <animateTransform attributeName="transform" type="translate" values="0,0;4,-8;0,0" dur="8.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="8.5s" repeatCount="indefinite"/>
  </text>
  <!-- ⚡ left mid -->
  <text x="22" y="148" font-family="sans-serif" font-size="18" fill="#fbbf24" opacity="0.22">
    ⚡
    <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4.5s" repeatCount="indefinite"/>
  </text>

  <!-- Sparkle particles -->
  <circle cx="195" cy="60" r="2" fill="#38bdf8">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="710" cy="80" r="1.5" fill="#c084fc">
    <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;5,-8;0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="245" r="1.5" fill="#818cf8">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,-12;0,0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="35" r="2" fill="#38bdf8">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,10;0,0" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="230" r="1.5" fill="#818cf8">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-4,-8;0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="195" r="1" fill="#c084fc">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;4,-6;0,0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="258" r="1.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Main name -->
  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="54" fill="url(#ng1)" filter="url(#glow-lg)" letter-spacing="2">
    THIRUMURUGAN K
  </text>

  <!-- Animated dashed underline -->
  <line x1="210" y1="138" x2="690" y2="138" stroke="url(#ng1)" stroke-width="1.8" stroke-dasharray="10 5" filter="url(#glow-sm)">
    <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="2.5s" repeatCount="indefinite"/>
  </line>

  <!-- Subtitle -->
  <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="16" fill="#8b949e" letter-spacing="3">
    FULL-STACK ENGINEER  ·  DSA ENTHUSIAST  ·  B.TECH AIML '28
  </text>

  <!-- Status pills -->
  <g>
    <!-- Pill 1: Open to Work -->
    <rect x="210" y="200" width="148" height="34" rx="17" fill="#0d2137" stroke="#38bdf8" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="283" y="223" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">🎯 Open to Work</text>

    <!-- Pill 2: Building -->
    <rect x="376" y="200" width="148" height="34" rx="17" fill="#12102a" stroke="#818cf8" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="449" y="223" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">💻 Building</text>

    <!-- Pill 3: Shipping -->
    <rect x="542" y="200" width="148" height="34" rx="17" fill="#180e25" stroke="#c084fc" stroke-width="1.3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="615" y="223" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">🚀 Shipping</text>
  </g>
</svg>
