<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="tbar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="fglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cursor-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window background -->
  <rect width="860" height="340" rx="10" fill="url(#tbg)"/>

  <!-- Animated border glow -->
  <rect width="860" height="340" rx="10" fill="none" stroke="url(#border-glow)" stroke-width="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Title bar -->
  <rect width="860" height="36" rx="10" fill="url(#tbar-grad)"/>
  <rect y="26" width="860" height="10" fill="url(#tbar-grad)"/>
  <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>

  <!-- Title text -->
  <text x="430" y="23" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#484f58">thirumurugan@dev — ~/about-me — 80×24</text>

  <!-- Scanline sweep (SMIL only) -->
  <rect x="0" y="36" width="860" height="6" fill="#38bdf8" opacity="0.03">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,310" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ── LINE 1: prompt + command ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.08;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="72" font-family="'Courier New', monospace" font-size="13.5" fill="#4ade80" filter="url(#fglow)">thirumurugan@dev</text>
    <text x="185" y="72" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">:</text>
    <text x="194" y="72" font-family="'Courier New', monospace" font-size="13.5" fill="#38bdf8">~</text>
    <text x="208" y="72" font-family="'Courier New', monospace" font-size="13.5" fill="#8b949e"> $ cat about.json</text>
  </g>

  <!-- ── LINE 2: separator ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.15;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="97" font-family="'Courier New', monospace" font-size="12" fill="#21262d">─────────────────────────────────────────────────────────────────</text>
  </g>

  <!-- ── LINE 3 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.21;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="121" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="121" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">role       </text>
    <text x="210" y="121" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="121" font-family="'Courier New', monospace" font-size="13.5" fill="#e2e8f0">"Full-Stack Engineer &amp; DSA Grinder"</text>
  </g>

  <!-- ── LINE 4 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.28;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="146" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="146" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">languages  </text>
    <text x="210" y="146" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="146" font-family="'Courier New', monospace" font-size="13.5" fill="#e2e8f0">["Java", "JS", "Python", "C++", "C"]</text>
  </g>

  <!-- ── LINE 5 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.35;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="171" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="171" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">stack      </text>
    <text x="210" y="171" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="171" font-family="'Courier New', monospace" font-size="13.5" fill="#e2e8f0">["React", "Node.js", "Express", "MySQL"]</text>
  </g>

  <!-- ── LINE 6 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.41;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="196" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="196" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">cloud      </text>
    <text x="210" y="196" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="196" font-family="'Courier New', monospace" font-size="13.5" fill="#e2e8f0">["AWS", "Docker", "GitHub Actions"]</text>
  </g>

  <!-- ── LINE 7 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.48;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="221" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="221" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">cgpa       </text>
    <text x="210" y="221" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="221" font-family="'Courier New', monospace" font-size="13.5" fill="#e2e8f0">"8.66 / 10 — B.Tech AIML '28"</text>
  </g>

  <!-- ── LINE 8 ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.55;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="246" font-family="'Courier New', monospace" font-size="13.5" fill="#c084fc">  ► </text>
    <text x="72" y="246" font-family="'Courier New', monospace" font-size="13.5" fill="#818cf8">status     </text>
    <text x="210" y="246" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">: </text>
    <text x="228" y="246" font-family="'Courier New', monospace" font-size="13.5" fill="#4ade80">"Compiling new ideas... 🚀"</text>
  </g>

  <!-- ── LINE 9: separator ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.63;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="271" font-family="'Courier New', monospace" font-size="12" fill="#21262d">─────────────────────────────────────────────────────────────────</text>
  </g>

  <!-- ── LINE 10: next prompt ── -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.67;0.70;1" dur="12s" repeatCount="indefinite"/>
    <text x="26" y="298" font-family="'Courier New', monospace" font-size="13.5" fill="#4ade80" filter="url(#fglow)">thirumurugan@dev</text>
    <text x="185" y="298" font-family="'Courier New', monospace" font-size="13.5" fill="#484f58">:</text>
    <text x="194" y="298" font-family="'Courier New', monospace" font-size="13.5" fill="#38bdf8">~</text>
    <text x="208" y="298" font-family="'Courier New', monospace" font-size="13.5" fill="#8b949e"> $ </text>
  </g>

  <!-- Blinking cursor (SMIL only) -->
  <rect x="242" y="283" width="9" height="17" fill="#4ade80" filter="url(#cursor-glow)">
    <animate attributeName="opacity" values="0;0;0;1;1;0;0;1;1;0" keyTimes="0;0.67;0.70;0.72;0.78;0.80;0.84;0.86;0.92;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1.1s" begin="8.5s" repeatCount="indefinite"/>
  </rect>
</svg>
